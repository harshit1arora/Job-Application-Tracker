services:
  - type: web
    name: job-tracker-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd Backend_FastAPI && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATA_DIR
        value: /var/data
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:4173,https://job-application-tracker-pearl-nine.vercel.app
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
